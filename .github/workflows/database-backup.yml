name: Meditiya Sathi Database Backup

on:
  schedule:
    # 11:00 PM IST = 17:30 UTC
    - cron: "30 17 * * *"

  workflow_dispatch:

jobs:
  database-backup:
    name: Database Backup
    runs-on: ubuntu-latest
    environment: backup

    steps:

      # =========================================
      # 1. Checkout Repository
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # =========================================
      # 2. Install PostgreSQL 18 Client
      # =========================================
      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -e

          echo "Installing PostgreSQL 18 client..."

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates \
            gnupg \
            lsb-release

          sudo install -d /usr/share/postgresql-common/pgdg

          curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update

          sudo apt-get install -y postgresql-client-18

          echo "PostgreSQL 18 installation completed."

          /usr/lib/postgresql/18/bin/pg_dump --version


      # =========================================
      # 3. Create Backup Directory
      # =========================================
      - name: Create backup directory
        run: |
          mkdir -p backups


      # =========================================
      # 4. Create PostgreSQL Backup
      # =========================================
      - name: Create PostgreSQL backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -e
          set -o pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL is missing."
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILE="backups/backup_${TIMESTAMP}.sql.gz"

          echo "========================================="
          echo "Creating PostgreSQL backup..."
          echo "========================================="

          /usr/lib/postgresql/18/bin/pg_dump --version

          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --format=plain \
            | gzip -9 > "$BACKUP_FILE"

          echo "========================================="
          echo "Backup created successfully!"
          echo "========================================="

          ls -lh "$BACKUP_FILE"

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"


      # =========================================
      # 5. Install Google Drive Client
      # =========================================
      - name: Install Google Drive client
        shell: bash
        run: |
          set -e

          npm init -y >/dev/null 2>&1
          npm install googleapis@latest


      # =========================================
      # 6. Check Existing Google Drive Secrets
      # =========================================
      - name: Check Google Drive configuration
        env:
          GDRIVE_CLIENT_EMAIL: ${{ secrets.GDRIVE_CLIENT_EMAIL }}
          GDRIVE_PRIVATE_KEY: ${{ secrets.GDRIVE_PRIVATE_KEY }}
          GDRIVE_DAILY_FOLDER_ID: ${{ secrets.GDRIVE_DAILY_FOLDER_ID }}
          GDRIVE_WEEKLY_FOLDER_ID: ${{ secrets.GDRIVE_WEEKLY_FOLDER_ID }}
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Checking Google Drive configuration..."
          echo "========================================="

          if [ -z "$GDRIVE_CLIENT_EMAIL" ]; then
            echo "ERROR: GDRIVE_CLIENT_EMAIL is missing."
            exit 1
          fi

          if [ -z "$GDRIVE_PRIVATE_KEY" ]; then
            echo "ERROR: GDRIVE_PRIVATE_KEY is missing."
            exit 1
          fi

          if [ -z "$GDRIVE_DAILY_FOLDER_ID" ]; then
            echo "ERROR: GDRIVE_DAILY_FOLDER_ID is missing."
            exit 1
          fi

          if [ -z "$GDRIVE_WEEKLY_FOLDER_ID" ]; then
            echo "WARNING: GDRIVE_WEEKLY_FOLDER_ID is missing."
            echo "Sunday weekly backup will be skipped."
          fi

          echo "Google Drive configuration is available."
          echo "Service account authentication will be used."


      # =========================================
      # 7. Upload Daily Backup
      # =========================================
      - name: Upload daily backup to Google Drive
        env:
          GDRIVE_CLIENT_EMAIL: ${{ secrets.GDRIVE_CLIENT_EMAIL }}
          GDRIVE_PRIVATE_KEY: ${{ secrets.GDRIVE_PRIVATE_KEY }}
          GDRIVE_DAILY_FOLDER_ID: ${{ secrets.GDRIVE_DAILY_FOLDER_ID }}
          BACKUP_FILE: ${{ env.BACKUP_FILE }}
          TIMESTAMP: ${{ env.TIMESTAMP }}
        shell: bash
        run: |
          set -e

          cat > upload-backup.mjs <<'EOF'
          import fs from "fs";
          import { google } from "googleapis";

          const clientEmail = process.env.GDRIVE_CLIENT_EMAIL;
          const privateKey = process.env.GDRIVE_PRIVATE_KEY;
          const folderId = process.env.GDRIVE_DAILY_FOLDER_ID;
          const backupFile = process.env.BACKUP_FILE;
          const timestamp = process.env.TIMESTAMP;

          if (!clientEmail) {
            throw new Error("GDRIVE_CLIENT_EMAIL is missing.");
          }

          if (!privateKey) {
            throw new Error("GDRIVE_PRIVATE_KEY is missing.");
          }

          if (!folderId) {
            throw new Error("GDRIVE_DAILY_FOLDER_ID is missing.");
          }

          if (!backupFile) {
            throw new Error("BACKUP_FILE is missing.");
          }

          if (!fs.existsSync(backupFile)) {
            throw new Error(`Backup file does not exist: ${backupFile}`);
          }

          const formattedPrivateKey = privateKey.replace(/\\n/g, "\n");

          const auth = new google.auth.JWT({
            email: clientEmail,
            key: formattedPrivateKey,
            scopes: [
              "https://www.googleapis.com/auth/drive.file"
            ]
          });

          const drive = google.drive({
            version: "v3",
            auth
          });

          const fileName = `backup_${timestamp}.sql.gz`;

          console.log("=========================================");
          console.log("Uploading daily backup...");
          console.log("=========================================");
          console.log(`File: ${fileName}`);

          const response = await drive.files.create({
            requestBody: {
              name: fileName,
              parents: [folderId]
            },
            media: {
              mimeType: "application/gzip",
              body: fs.createReadStream(backupFile)
            },
            fields: "id,name"
          });

          console.log("=========================================");
          console.log("Daily backup uploaded successfully.");
          console.log("=========================================");
          console.log(`File: ${response.data.name}`);
          console.log(`File ID: ${response.data.id}`);
          EOF

          node upload-backup.mjs


      # =========================================
      # 8. Upload Sunday Weekly Backup
      # =========================================
      - name: Upload Sunday weekly backup
        if: success()
        env:
          GDRIVE_CLIENT_EMAIL: ${{ secrets.GDRIVE_CLIENT_EMAIL }}
          GDRIVE_PRIVATE_KEY: ${{ secrets.GDRIVE_PRIVATE_KEY }}
          GDRIVE_WEEKLY_FOLDER_ID: ${{ secrets.GDRIVE_WEEKLY_FOLDER_ID }}
          BACKUP_FILE: ${{ env.BACKUP_FILE }}
          TIMESTAMP: ${{ env.TIMESTAMP }}
        shell: bash
        run: |
          set -e

          DAY_OF_WEEK=$(date -u +"%u")

          if [ "$DAY_OF_WEEK" != "7" ]; then
            echo "Today is not Sunday."
            echo "Skipping weekly backup."
            exit 0
          fi

          if [ -z "$GDRIVE_WEEKLY_FOLDER_ID" ]; then
            echo "GDRIVE_WEEKLY_FOLDER_ID is missing."
            echo "Skipping weekly backup."
            exit 0
          fi

          cat > upload-weekly.mjs <<'EOF'
          import fs from "fs";
          import { google } from "googleapis";

          const clientEmail = process.env.GDRIVE_CLIENT_EMAIL;
          const privateKey = process.env.GDRIVE_PRIVATE_KEY;
          const folderId = process.env.GDRIVE_WEEKLY_FOLDER_ID;
          const backupFile = process.env.BACKUP_FILE;
          const timestamp = process.env.TIMESTAMP;

          if (!clientEmail) {
            throw new Error("GDRIVE_CLIENT_EMAIL is missing.");
          }

          if (!privateKey) {
            throw new Error("GDRIVE_PRIVATE_KEY is missing.");
          }

          if (!folderId) {
            throw new Error("GDRIVE_WEEKLY_FOLDER_ID is missing.");
          }

          if (!backupFile) {
            throw new Error("BACKUP_FILE is missing.");
          }

          if (!fs.existsSync(backupFile)) {
            throw new Error(`Backup file does not exist: ${backupFile}`);
          }

          const formattedPrivateKey = privateKey.replace(/\\n/g, "\n");

          const auth = new google.auth.JWT({
            email: clientEmail,
            key: formattedPrivateKey,
            scopes: [
              "https://www.googleapis.com/auth/drive.file"
            ]
          });

          const drive = google.drive({
            version: "v3",
            auth
          });

          const date = timestamp.split("_")[0];

          const fileName = `weekly_backup_${date}.sql.gz`;

          console.log("=========================================");
          console.log("Uploading Sunday weekly backup...");
          console.log("=========================================");
          console.log(`File: ${fileName}`);

          const response = await drive.files.create({
            requestBody: {
              name: fileName,
              parents: [folderId]
            },
            media: {
              mimeType: "application/gzip",
              body: fs.createReadStream(backupFile)
            },
            fields: "id,name"
          });

          console.log("=========================================");
          console.log("Weekly backup uploaded successfully.");
          console.log("=========================================");
          console.log(`File: ${response.data.name}`);
          console.log(`File ID: ${response.data.id}`);
          EOF

          node upload-weekly.mjs


      # =========================================
      # 9. Cleanup
      # =========================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf backups
          rm -f upload-backup.mjs
          rm -f upload-weekly.mjs
          rm -f package.json
          rm -f package-lock.json


      # =========================================
      # 10. Backup Completed
      # =========================================
      - name: Backup completed
        if: success()
        shell: bash
        run: |
          echo "========================================="
          echo "Meditiya Sathi database backup completed"
          echo "========================================="
          echo "Backup completed successfully."
          echo "Time: $(date -u)"
          echo "========================================="
