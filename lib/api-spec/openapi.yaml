openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Meditiya Sathi - Digital Society Management Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stats
    description: Dashboard statistics
  - name: events
    description: Event management
  - name: notices
    description: Notice board
  - name: gallery
    description: Photo and video gallery
  - name: donations
    description: Donation management
  - name: festivals
    description: Festival management
  - name: volunteers
    description: Volunteer management
  - name: competitions
    description: Competition management
  - name: services
    description: Community service requests
  - name: marketplace
    description: Marketplace listings
  - name: lostfound
    description: Lost and found items
  - name: committee
    description: Committee members
  - name: emergency
    description: Emergency contacts
  - name: users
    description: User profiles
  - name: sponsors
    description: Sponsors and partners
  - name: testimonials
    description: Community testimonials

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── STATS ──────────────────────────────────────────────────────────────────
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get platform statistics summary
      responses:
        "200":
          description: Statistics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/donation-progress:
    get:
      operationId: getDonationProgress
      tags: [stats]
      summary: Get donation progress for current festival
      responses:
        "200":
          description: Donation progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationProgress"

  # ── EVENTS ─────────────────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, past, all]
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update event (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete event (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{id}/register:
    post:
      operationId: registerForEvent
      tags: [events]
      summary: Register for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRegistrationInput"
      responses:
        "201":
          description: Registration confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRegistration"

  /events/upcoming/summary:
    get:
      operationId: getUpcomingEventsSummary
      tags: [events]
      summary: Get next 3 upcoming events for homepage
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  # ── NOTICES ────────────────────────────────────────────────────────────────
  /notices:
    get:
      operationId: listNotices
      tags: [notices]
      summary: List notices
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: pinned
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of notices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notice"
    post:
      operationId: createNotice
      tags: [notices]
      summary: Create notice (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"

  /notices/{id}:
    get:
      operationId: getNotice
      tags: [notices]
      summary: Get notice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
    patch:
      operationId: updateNotice
      tags: [notices]
      summary: Update notice (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
    delete:
      operationId: deleteNotice
      tags: [notices]
      summary: Delete notice (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── GALLERY ────────────────────────────────────────────────────────────────
  /gallery/albums:
    get:
      operationId: listAlbums
      tags: [gallery]
      summary: List gallery albums
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: festival
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Albums
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Album"
    post:
      operationId: createAlbum
      tags: [gallery]
      summary: Create album (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlbumInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"

  /gallery/albums/{id}/photos:
    get:
      operationId: listAlbumPhotos
      tags: [gallery]
      summary: List photos in album
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"
    post:
      operationId: addPhotoToAlbum
      tags: [gallery]
      summary: Add photo to album (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryPhotoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPhoto"

  /gallery/featured:
    get:
      operationId: getFeaturedGallery
      tags: [gallery]
      summary: Get featured gallery photos for homepage
      responses:
        "200":
          description: Featured photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"

  # ── DONATIONS ──────────────────────────────────────────────────────────────
  /donations:
    get:
      operationId: listDonations
      tags: [donations]
      summary: List donations
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Donations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donation"
    post:
      operationId: createDonation
      tags: [donations]
      summary: Record a donation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"

  /donations/top-donors:
    get:
      operationId: getTopDonors
      tags: [donations]
      summary: Get top donors leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Top donors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonorSummary"

  # ── FESTIVALS ──────────────────────────────────────────────────────────────
  /festivals:
    get:
      operationId: listFestivals
      tags: [festivals]
      summary: List festivals
      responses:
        "200":
          description: Festivals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Festival"
    post:
      operationId: createFestival
      tags: [festivals]
      summary: Create festival (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FestivalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Festival"

  /festivals/{slug}:
    get:
      operationId: getFestival
      tags: [festivals]
      summary: Get festival details by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Festival
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Festival"

  # ── VOLUNTEERS ─────────────────────────────────────────────────────────────
  /volunteers:
    get:
      operationId: listVolunteers
      tags: [volunteers]
      summary: List volunteers
      parameters:
        - name: festival
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Volunteers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volunteer"
    post:
      operationId: joinVolunteer
      tags: [volunteers]
      summary: Apply to become a volunteer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volunteer"

  # ── COMPETITIONS ───────────────────────────────────────────────────────────
  /competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: List competitions
      responses:
        "200":
          description: Competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
    post:
      operationId: createCompetition
      tags: [competitions]
      summary: Create competition (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{id}/register:
    post:
      operationId: registerForCompetition
      tags: [competitions]
      summary: Register for a competition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionRegistrationInput"
      responses:
        "201":
          description: Registration confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRegistration"

  /competitions/{id}/winners:
    get:
      operationId: getCompetitionWinners
      tags: [competitions]
      summary: Get winners for a competition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Winners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitionWinner"

  # ── COMMUNITY SERVICES ─────────────────────────────────────────────────────
  /services/requests:
    get:
      operationId: listServiceRequests
      tags: [services]
      summary: List service requests (admin or own)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, resolved, all]
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Service requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequest"
    post:
      operationId: createServiceRequest
      tags: [services]
      summary: Submit a service request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"

  /services/requests/{id}:
    patch:
      operationId: updateServiceRequest
      tags: [services]
      summary: Update service request status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"

  # ── MARKETPLACE ────────────────────────────────────────────────────────────
  /marketplace:
    get:
      operationId: listMarketplaceItems
      tags: [marketplace]
      summary: List marketplace listings
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [sell, buy, donate, all]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceItem"
    post:
      operationId: createMarketplaceItem
      tags: [marketplace]
      summary: Create listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceItem"

  /marketplace/{id}:
    delete:
      operationId: deleteMarketplaceItem
      tags: [marketplace]
      summary: Delete listing (owner/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── LOST & FOUND ───────────────────────────────────────────────────────────
  /lostfound:
    get:
      operationId: listLostFoundItems
      tags: [lostfound]
      summary: List lost and found items
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [lost, found, all]
        - name: resolved
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LostFoundItem"
    post:
      operationId: createLostFoundItem
      tags: [lostfound]
      summary: Report lost or found item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LostFoundItemInput"
      responses:
        "201":
          description: Reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LostFoundItem"

  # ── COMMITTEE ──────────────────────────────────────────────────────────────
  /committee:
    get:
      operationId: listCommitteeMembers
      tags: [committee]
      summary: List committee members
      responses:
        "200":
          description: Committee members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommitteeMember"
    post:
      operationId: createCommitteeMember
      tags: [committee]
      summary: Add committee member (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitteeMemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitteeMember"

  # ── EMERGENCY CONTACTS ─────────────────────────────────────────────────────
  /emergency:
    get:
      operationId: listEmergencyContacts
      tags: [emergency]
      summary: List emergency contacts
      responses:
        "200":
          description: Emergency contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmergencyContact"

  # ── SPONSORS ───────────────────────────────────────────────────────────────
  /sponsors:
    get:
      operationId: listSponsors
      tags: [sponsors]
      summary: List sponsors and partners
      responses:
        "200":
          description: Sponsors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sponsor"

  # ── TESTIMONIALS ───────────────────────────────────────────────────────────
  /testimonials:
    get:
      operationId: listTestimonials
      tags: [testimonials]
      summary: List community testimonials
      responses:
        "200":
          description: Testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"

  # ── USER PROFILE ───────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/dashboard:
    get:
      operationId: getMyDashboard
      tags: [users]
      summary: Get user dashboard data (events, donations, volunteer status, etc.)
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDashboard"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── STATS ───────────────────────────────────────────────────────────────
    StatsSummary:
      type: object
      required: [totalResidents, totalEvents, totalDonations, totalVolunteers, activeComplaints, festivalDaysLeft]
      properties:
        totalResidents:
          type: integer
        totalEvents:
          type: integer
        totalDonations:
          type: number
        totalVolunteers:
          type: integer
        activeComplaints:
          type: integer
        festivalDaysLeft:
          type: integer

    DonationProgress:
      type: object
      required: [goal, raised, percentage, festivalName]
      properties:
        goal:
          type: number
        raised:
          type: number
        percentage:
          type: number
        festivalName:
          type: string
        donorCount:
          type: integer

    # ── EVENTS ──────────────────────────────────────────────────────────────
    Event:
      type: object
      required: [id, title, description, date, location, category, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        endDate:
          type: ["string", "null"]
          format: date-time
        location:
          type: string
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [upcoming, ongoing, completed, cancelled]
        maxParticipants:
          type: ["integer", "null"]
        registrationCount:
          type: integer
        festivalId:
          type: ["integer", "null"]
        createdAt:
          type: string

    EventInput:
      type: object
      required: [title, description, date, location, category]
      properties:
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        endDate:
          type: ["string", "null"]
        location:
          type: string
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        maxParticipants:
          type: ["integer", "null"]
        festivalId:
          type: ["integer", "null"]

    EventUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        date:
          type: string
        endDate:
          type: ["string", "null"]
        location:
          type: string
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        status:
          type: string
        maxParticipants:
          type: ["integer", "null"]

    EventRegistration:
      type: object
      required: [id, eventId, userId, registeredAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        userId:
          type: string
        userName:
          type: string
        registeredAt:
          type: string

    EventRegistrationInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        familyMembers:
          type: ["integer", "null"]

    # ── NOTICES ─────────────────────────────────────────────────────────────
    Notice:
      type: object
      required: [id, title, content, category, isPinned, createdAt]
      properties:
        id:
