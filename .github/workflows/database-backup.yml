```yaml
name: Meditiya Sathi Database Backup

on:
  workflow_dispatch:

jobs:
  database-backup:
    runs-on: ubuntu-latest
    environment: backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner: $(uname -a)"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "OS:"
          cat /etc/os-release

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing PostgreSQL client..."

          sudo apt-get update
          sudo apt-get install -y postgresql-client

          echo "pg_dump version:"
          pg_dump --version

      - name: Check DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: DATABASE_URL secret is missing."
            exit 1
          fi

          echo "DATABASE_URL secret exists."

      - name: Test PostgreSQL connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing PostgreSQL connection..."

          pg_isready -d "$DATABASE_URL" || true

          echo "Running PostgreSQL connection test..."

          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT current_database(), current_user, version();"

          echo "PostgreSQL connection successful."

      - name: Create backup directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p backups

      - name: Create PostgreSQL backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILE="backups/backup_${TIMESTAMP}.sql.gz"

          echo "Creating backup..."
          echo "File: $BACKUP_FILE"

          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --format=plain \
            | gzip -9 > "$BACKUP_FILE"

          if [ ! -s "$BACKUP_FILE" ]; then
            echo "ERROR: Backup file is empty."
            exit 1
          fi

          echo "Backup created successfully."

          ls -lh "$BACKUP_FILE"

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"

      - name: Install Google API client
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-save googleapis

          node -e "import('googleapis').then(() => console.log('googleapis loaded successfully'))"

      - name: Check Google Drive secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GDRIVE_DAILY_FOLDER_ID: ${{ secrets.GDRIVE_DAILY_FOLDER_ID }}
          GDRIVE_WEEKLY_FOLDER_ID: ${{ secrets.GDRIVE_WEEKLY_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Google Drive configuration..."

          [ -n "${GOOGLE_CLIENT_ID:-}" ] || {
            echo "ERROR: GOOGLE_CLIENT_ID is missing."
            exit 1
          }

          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] || {
            echo "ERROR: GOOGLE_CLIENT_SECRET is missing."
            exit 1
          }

          [ -n "${GOOGLE_REFRESH_TOKEN:-}" ] || {
            echo "ERROR: GOOGLE_REFRESH_TOKEN is missing."
            exit 1
          }

          [ -n "${GDRIVE_DAILY_FOLDER_ID:-}" ] || {
            echo "ERROR: GDRIVE_DAILY_FOLDER_ID is missing."
            exit 1
          }

          echo "Required Google Drive secrets exist."

          if [ -z "${GDRIVE_WEEKLY_FOLDER_ID:-}" ]; then
            echo "WARNING: GDRIVE_WEEKLY_FOLDER_ID is missing."
            echo "Weekly backup will be skipped."
          else
            echo "Weekly Google Drive folder is configured."
          fi

      - name: Upload daily backup
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GDRIVE_DAILY_FOLDER_ID: ${{ secrets.GDRIVE_DAILY_FOLDER_ID }}
          BACKUP_FILE: ${{ env.BACKUP_FILE }}
          TIMESTAMP: ${{ env.TIMESTAMP }}
        shell: bash
        run: |
          set -euo pipefail

          cat > upload-backup.mjs <<'EOF'
          import fs from "node:fs";
          import { google } from "googleapis";

          const {
            GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET,
            GOOGLE_REFRESH_TOKEN,
            GDRIVE_DAILY_FOLDER_ID,
            BACKUP_FILE,
            TIMESTAMP
          } = process.env;

          if (!fs.existsSync(BACKUP_FILE)) {
            throw new Error(`Backup file does not exist: ${BACKUP_FILE}`);
          }

          const auth = new google.auth.OAuth2(
            GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET
          );

          auth.setCredentials({
            refresh_token: GOOGLE_REFRESH_TOKEN
          });

          const drive = google.drive({
            version: "v3",
            auth
          });

          const fileName = `backup_${TIMESTAMP}.sql.gz`;

          console.log(`Uploading ${fileName}...`);

          const response = await drive.files.create({
            requestBody: {
              name: fileName,
              parents: [GDRIVE_DAILY_FOLDER_ID]
            },
            media: {
              mimeType: "application/gzip",
              body: fs.createReadStream(BACKUP_FILE)
            },
            fields: "id,name"
          });

          console.log("Daily backup uploaded successfully.");
          console.log(`File: ${response.data.name}`);
          console.log(`File ID: ${response.data.id}`);
          EOF

          node upload-backup.mjs

      - name: Upload Sunday weekly backup
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GDRIVE_WEEKLY_FOLDER_ID: ${{ secrets.GDRIVE_WEEKLY_FOLDER_ID }}
          BACKUP_FILE: ${{ env.BACKUP_FILE }}
          TIMESTAMP: ${{ env.TIMESTAMP }}
        shell: bash
        run: |
          set -euo pipefail

          DAY_OF_WEEK=$(date -u +"%u")

          if [ "$DAY_OF_WEEK" != "7" ]; then
            echo "Today is not Sunday. Weekly backup skipped."
            exit 0
          fi

          if [ -z "${GDRIVE_WEEKLY_FOLDER_ID:-}" ]; then
            echo "GDRIVE_WEEKLY_FOLDER_ID is missing."
            echo "Weekly backup skipped."
            exit 0
          fi

          cat > upload-weekly.mjs <<'EOF'
          import fs from "node:fs";
          import { google } from "googleapis";

          const {
            GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET,
            GOOGLE_REFRESH_TOKEN,
            GDRIVE_WEEKLY_FOLDER_ID,
            BACKUP_FILE,
            TIMESTAMP
          } = process.env;

          const auth = new google.auth.OAuth2(
            GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET
          );

          auth.setCredentials({
            refresh_token: GOOGLE_REFRESH_TOKEN
          });

          const drive = google.drive({
            version: "v3",
            auth
          });

          const date = TIMESTAMP.split("_")[0];
          const fileName = `weekly_backup_${date}.sql.gz`;

          console.log(`Uploading ${fileName}...`);

          const response = await drive.files.create({
            requestBody: {
              name: fileName,
              parents: [GDRIVE_WEEKLY_FOLDER_ID]
            },
            media: {
              mimeType: "application/gzip",
              body: fs.createReadStream(BACKUP_FILE)
            },
            fields: "id,name"
          });

          console.log("Weekly backup uploaded successfully.");
          console.log(`File: ${response.data.name}`);
          console.log(`File ID: ${response.data.id}`);
          EOF

          node upload-weekly.mjs

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf backups
          rm -f upload-backup.mjs
          rm -f upload-weekly.mjs

      - name: Backup completed
        if: success()
        run: |
          echo "========================================="
          echo "DATABASE BACKUP COMPLETED SUCCESSFULLY"
          echo "========================================="
          echo "Time: $(date -u)"
```
